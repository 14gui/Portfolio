{% extends 'portfolio/layout.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4 border-top border-dark border-4">
                <h2 class="text-center fw-bold mb-4">Criar Conta</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    
                    <button type="submit" class="btn btn-dark w-100 fw-bold shadow-sm">
                        <i class="fa-solid fa-user-plus me-2"></i>Registar
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Já tens credenciais de acesso?</p>
                    <a href="{% url 'login' %}" class="text-decoration-none fw-bold text-dark">Entrar no Sistema</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
