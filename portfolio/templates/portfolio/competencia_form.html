{% extends 'portfolio/layout.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="fw-bold mb-4">{{ acao }} Competência</h2>
    <div class="card shadow-sm border-0 p-4">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark fw-bold mt-3">Guardar Registo</button>
            <a href="{% url 'competencias' %}" class="btn btn-outline-secondary mt-3 ms-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
