{% extends 'portfolio/layout.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="mb-4 border-bottom pb-2">
                {% if projeto %} Editar Projeto: {{ projeto.titulo }} {% else %} Adicionar Novo Projeto {% endif %}
            </h1>
            
            <div class="card shadow border-0 p-4">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% url 'projetos' %}" class="btn btn-outline-secondary px-4">
                            <i class="fa-solid fa-xmark me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-dark px-5 fw-bold">
                            <i class="fa-solid fa-save me-2"></i>{% if projeto %}Guardar Alterações{% else %}Gravar Projeto{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Truque para o formulário do Django não parecer saído de 1995 */
    form p label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 5px;
    }
    form p input, form p textarea, form p select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ced4da;
        border-radius: 5px;
    }
</style>
{% endblock %}
