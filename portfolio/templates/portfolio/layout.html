{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Portfólio | Guilherme Duarte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; background-color: #212529; color: white; position: fixed; width: 250px; }
        .content { margin-left: 260px; padding: 20px; }
        .nav-link { color: #adb5bd; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #343a40; }
    </style>
</head>
<body>
    <div class="sidebar d-flex flex-column p-3">
        <div class="text-center mb-4 mt-2">
            <img src="{% static 'portfolio/images/logo.png' %}" alt="Logo" class="img-fluid bg-white p-2 rounded" style="max-height: 80px;">
        </div>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="{% url 'index' %}" class="nav-link text-white">Início</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'academico' %}" class="nav-link text-white">Académico</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'projetos' %}" class="nav-link text-white">Projetos</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'competencias' %}" class="nav-link text-white">Competências</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'lista_artigos' %}" class="nav-link text-white">Artigos</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'sobre' %}" class="nav-link text-white">Sobre a Aplicação</a>
            </li>
        </ul>

        <hr class="text-white-50">
        <div class="px-2 mb-2">
            {% if user.is_authenticated %}
                <p class="small text-muted mb-2 text-center">Bem vindo <strong>{{ user.username }}</strong></p>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-danger w-100 fw-bold shadow-sm">
                    <i class="fa-solid fa-right-from-bracket me-2"></i>Sair
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-light w-100 mb-2 fw-bold shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
                </a>
                <a href="{% url 'registo' %}" class="btn btn-sm btn-outline-light w-100 fw-bold">
                    <i class="fa-solid fa-user-plus me-2"></i>Registo
                </a>
            {% endif %}
        </div>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
