{% extends 'portfolio/layout.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 text-center">
            <div class="card border-0 shadow-sm p-4">
                <h4 class="fw-bold">Apagar Artigo</h4>
                <p class="text-muted">Tens a certeza que queres apagar <strong>{{ artigo.titulo }}</strong>? Esta ação é irreversível.</p>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger fw-bold me-2">Sim, apagar</button>
                    <a href="{% url 'detalhe_artigo' artigo.id %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
